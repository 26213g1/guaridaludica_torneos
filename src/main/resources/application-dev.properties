spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=guaridaL02
#spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool de conexiones Hikari para Supabase
spring.datasource.hikari.max-lifetime=287000
spring.datasource.hikari.idle-timeout=300000
# Limita el tamaño máximo del pool de conexiones a 5 o 10 (por debajo del límite de 15 de Supabase)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Deshabilitar prepared statements en caché para el Transaction Pooler de Supabase
spring.datasource.hikari.dataSource.prepareThreshold=0
spring.datasource.hikari.dataSource.preparedStatementCacheQueries=0

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
# Oculta las impresiones de los SQL de Hibernate en la consola
spring.jpa.show-sql=false
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

