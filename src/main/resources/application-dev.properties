# Muestra los logs detallados de tus propios paquetes (cambia com.shop por la raíz de tu proyecto)
logging.level.com.shop=DEBUG

# 1. Apaga el nivel TRACE y DEBUG general y ponlo en INFO o WARN
logging.level.root=INFO

# 2. Si quieres seguir viendo las consultas SQL cuando tú quieras depurar, déjalas en DEBUG,
# pero puedes ocultar los "binders" (los valores que se pasan por parámetro que ensucian mucho)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
# Opcional: ver los parámetros que viajan en las consultas SQL
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 3. Silencia logs molestos de frameworks que no necesitas ver constantemente
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# 4. Mantén tus propias clases (tus controladores y servicios) en DEBUG o INFO para ver tus trazas
logging.level.com.shop.guaridaludica_torneos=DEBUG