<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="100%" height="100%">
  <!-- ICONO -->
  <g transform="translate(5, 5)">
    <!-- Arco de la cueva en blanco brillante / translúcido -->
    <path d="M10,45 C10,18 22,4 35,4 C48,4 60,18 60,45 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,45 C18,25 25,12 35,12 C45,12 52,25 52,45 Z" fill="#0dcaf0" opacity="0.15"/>
    
    <!-- Dado D20 en tonos cian y amarillo neón -->
    <polygon points="35,10 47,20 42,38 28,38 23,20" fill="#0dcaf0" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="35,10 35,26 47,20" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <polyline points="35,26 42,38" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <polyline points="35,26 28,38" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <polyline points="35,26 23,20" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="35" cy="22" r="1.5" fill="#ffc107"/>
  </g>

  <!-- TEXTO (Con alto contraste para navbar oscura) -->
  <text x="75" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="1">
    LA GUARIDA
