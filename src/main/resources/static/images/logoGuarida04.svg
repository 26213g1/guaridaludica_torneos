<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="100%" height="100%">
  <!-- ICONO -->
  <g transform="translate(5, 5)">
    <!-- Ficha / Carta de fondo rotada -->
    <rect x="20" y="10" width="22" height="32" rx="3" transform="rotate(-15 31 26)" fill="#fd7e14" opacity="0.8"/>
    <!-- Ficha / Carta delantera rotada -->
    <rect x="25" y="12" width="22" height="32" rx="3" transform="rotate(15 36 28)" fill="#0dcaf0" opacity="0.8"/>
