<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/admin-layout :: layout(~{::main})}">
<body>
    <main>
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold">📁 Gestión de Categorías</h3>
                <a th:href="@{/admin/categorias/nuevo}" class="btn btn-success">
                    <i class="fa-solid fa-plus me-1"></i> Nueva Categoría
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categorias}">
                                <td th:text="${cat.id}">1</td>
                                <td class="fw-bold" th:text="${cat.nombre}">Nombre</td>
                                <td th:text="${#strings.abbreviate(cat.descripcion, 60)}">Descripción...</td>
                                <td class="text-end">
                                    <a th:href="@{/admin/categorias/editar/{id}(id=${cat.id})}" class="btn btn-sm btn-warning me-1">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <a th:href="@{/admin/categorias/eliminar/{id}(id=${cat.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro de eliminar esta categoría?');">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categorias)}">
                                <td colspan="4" class="text-center text-muted py-4">No hay categorías registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
