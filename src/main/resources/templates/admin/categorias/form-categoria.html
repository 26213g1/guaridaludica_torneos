<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/admin-layout :: layout(~{::main})}">

<body>
    <main>
        <div class="container my-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm p-4">
                        <h3 class="mb-4 fw-bold"
                            th:text="${categoria.id == null} ? '📁 Nueva Categoría' : '✏️ Editar Categoría'">Gestión
                            Categoría</h3>

                        <form th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post">

                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de la Categoría</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required
                                    placeholder="Ej: Estrategia, Dados, fillers...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="3"
                                    placeholder="Breve descripción de la categoría..."></textarea>
                            </div>

                            <h3>Productos asociados a esta categoría:</h3>
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Nombre del Producto</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="prod : ${productosAsociados}">
                                        <td th:text="${prod.nombre}"></td>
                                        <td>
                                            <!-- Un enlace simple con GET -->
                                            <a th:href="@{/admin/categorias/quitar-asociacion(categoriaId=${categoria.id}, productoId=${prod.id})}"
                                                class="btn btn-sm btn-outline-danger">
                                                Quitar de esta categoría
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Categoría</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
