<div xmlns:th="http://www.thymeleaf.org">
    <!-- Cabecera del Dashboard -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold m-0"><i class="bi bi-speedometer2 text-primary"></i> Panel de Administración</h2>
            <p class="text-muted small m-0">Resumen de actividad en La Guarida Lúdica</p>
        </div>
        <div>
            <a th:href="@{/torneos/nuevo}" class="btn btn-success me-2">
                <i class="bi bi-plus-lg"></i> Crear Torneo
            </a>
            <a th:href="@{/torneos}" class="btn btn-outline-secondary">
                <i class="bi bi-trophy"></i> Gestionar Torneos
            </a>
        </div>
    </div>

    <!-- Tarjetas de Métricas Rápidas (KPIs) -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card text-white bg-primary shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="card-title text-uppercase mb-1 opacity-75">Jugadores</h6>
                        <h2 class="display-6 fw-bold mb-0" th:text="${totalJugadores}">0</h2>
                    </div>
                    <i class="bi bi-people fs-1 opacity-50"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-success shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="card-title text-uppercase mb-1 opacity-75">Torneos Abiertos</h6>
                        <h2 class="display-6 fw-bold mb-0" th:text="${torneosAbiertos}">0</h2>
                    </div>
                    <i class="bi bi-door-open fs-1 opacity-50"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-warning text-dark shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="card-title text-uppercase mb-1 opacity-75">En Curso</h6>
                        <h2 class="display-6 fw-bold mb-0" th:text="${torneosEnCurso}">0</h2>
                    </div>
                    <i class="bi bi-controller fs-1 opacity-50"></i>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-secondary shadow-sm h-100">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="card-title text-uppercase mb-1 opacity-75">Finalizados</h6>
                        <h2 class="display-6 fw-bold mb-0" th:text="${torneosFinalizados}">0</h2>
                    </div>
                    <i class="bi bi-check2-circle fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Bloque de accesos directos de gestión -->
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white fw-bold">
                    <i class="bi bi-tools me-2"></i> Acciones Rápidas
                </div>
                <div class="card-body">
                    <div class="list-group list-group-flush">
                        <a th:href="@{/torneos/nuevo}" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="bi bi-plus-circle text-success me-3 fs-5"></i>
                            <div>
                                <strong>Nuevo Torneo</strong>
                                <div class="text-muted small">Publica un nuevo evento para la comunidad</div>
                            </div>
                        </a>
                        <a th:href="@{/jugadores/ranking}" class="list-group-item list-group-item-action d-flex align-items-center">
                            <i class="bi bi-award text-warning me-3 fs-5"></i>
                            <div>
                                <strong>Ranking Público</strong>
                                <div class="text-muted small">Revisa la clasificación general y los ELOs</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
