<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/admin-layout :: layout(~{::main})}">

<body>
    <main>
        <div class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>👥 Gestión de Usuarios</h2>
                <!-- Opcional si añades alta manual de usuarios -->
                <!-- <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-success">+ Nuevo Usuario</a> -->
            </div>

            <a th:href="@{/admin}" class="btn btn-secondary mb-3">← Volver al Panel</a>

            <!-- Barra de búsqueda / filtros (puedes reutilizar la de usuarios o adaptar una similar) -->
            <div th:replace="~{admin/fragments/filtros-usuarios :: barra-filtros-usuarios}"></div>

            <div class="table-responsive bg-white p-3 rounded shadow-sm">
                <table class="table table-hover table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Alias</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Estado Pedidos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.alias}">DungeonMaster</td>
                            <td th:text="${u.nombre}">Nombre Apellido</td>
                            <td th:text="${u.email}">correo@example.com</td>
                            <td>
                                <!-- Muestra los roles del usuario -->
                                <span th:each="rol : ${u.roles}" class="badge bg-secondary me-1" th:text="${rol}">ROLE_USER</span>
                            </td>
                            <td>
                                <!-- Indicador de pedidos usando el service -->
                                <span th:if="${usuarioService.usuarioTienePedidos(u.id)}" class="badge bg-danger">
                                    📦 Con Pedidos
                                </span>
                                <span th:unless="${usuarioService.usuarioTienePedidos(u.id)}" class="badge bg-success">
                                    ✨ Sin Pedidos
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}"
                                    class="btn btn-warning btn-sm"><i class="fa-solid fa-pen"></i></a>
                                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Estás seguro de eliminar este usuario?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Paginación reutilizada pasando la ruta correspondiente -->
                <div th:replace="~{fragments/paginacion :: pagination('/admin/usuarios')}"></div>
            </div>
        </div>
    </main>
</body>

</html>
