<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/admin-layout :: layout(~{::main})}">

<body>
    <main>
        <div class="container my-4" style="max-width: 600px;">
            <h2>✏️ Editar Roles de Usuario</h2>
            <hr>

            <form th:action="@{/admin/usuarios/editar/{id}(id=${usuario.id})}" method="post" class="bg-white p-4 rounded shadow-sm">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre:</label>
                    <p class="form-control-plaintext" th:text="${usuario.nombre}">Nombre</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email:</label>
                    <p class="form-control-plaintext" th:text="${usuario.email}">email@example.com</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Asignar Roles:</label>
                    
                    <!-- Iteramos con th:each en lugar de th:for -->
                    <div class="form-check" th:each="rol : ${rolesDisponibles}">
                        <input class="form-check-input" type="checkbox" name="roles" 
                            th:value="${rol}" 
                            th:checked="${usuario.roles.contains(rol)}" 
                            th:id="${'rol-' + rol}"
                            th:disabled="${rol == 'ROLE_USER' and usuario.roles.contains('ROLE_USER') and usuario.roles.size() == 1}"><!-- Aquí está el truco: Si quieres evitar que quiten el ROLE_USER -->

                        <label class="form-check-label" th:for="${'rol-' + rol}" th:text="${rol}">
                            ROLE_USER
                        </label>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
