<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - La Guarida Lúdica</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Barra Superior de Administración -->
    <nav class="navbar navbar-dark bg-dark shadow-sm px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            <i class="fa-solid fa-gear me-2"></i> La Guarida Lúdica | Admin
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" th:href="@{/}">
                <i class="fa-solid fa-store me-1"></i> Ver Tienda
            </a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral de Administración -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse border-end min-vh-100 p-3">
                <div class="position-sticky">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase fw-bold fs-7">
                        <span>Menú Principal</span>
                    </h6>
                    <ul class="nav flex-column nav-pills mt-2">
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/productos}">
                                <i class="fa-solid fa-dice me-2 text-primary"></i> Productos
                            </a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/categorias}">
                                <i class="fa-solid fa-folder me-2 text-success"></i> Categorías
                            </a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/usuarios}">
                                <i class="fa-solid fa-users me-2 text-warning"></i> Usuarios
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido Principal Dinámico -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div th:replace="${content}">
                    <!-- Aquí se inyectará el contenido de cada vista de administración -->
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
