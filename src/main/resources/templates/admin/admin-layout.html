<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - La Guarida Lúdica</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <!-- Spinner de carga global para navegación -->
    <div th:replace="~{fragments/loader :: globalLoader}"></div>
    <!-- Ejemplo en tu layout de Thymeleaf -->
    <script th:src="@{/js/loader.js}"></script>

    <!-- Barra Superior de Administración Inyectada desde tu fragmento -->
    <header>
        <div th:replace="~{admin/fragments/admin-navbar :: adminNavbar}"></div>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <!-- Menú Lateral de Administración -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse border-end p-3">
                <div class="position-sticky">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase fw-bold fs-7">
                        <span>Menú Principal</span>
                    </h6>
                    <ul class="nav flex-column nav-pills mt-2">
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/productos}">
                                <i class="fa-solid fa-dice me-2 text-primary"></i> Productos
                            </a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/categorias}">
                                <i class="fa-solid fa-folder me-2 text-success"></i> Categorías
                            </a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/usuarios}">
                                <i class="fa-solid fa-users me-2 text-warning"></i> Usuarios
                            </a>
                        </li>
                        <li class="nav-item mb-1">
                            <a class="nav-link text-dark" th:href="@{/admin/pedidos}">
                                <i class="fa-solid fa-box me-2 text-danger"></i> Pedidos
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido Principal Dinámico -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div th:replace="${content}">
                    <!-- Aquí se inyectará el contenido de cada vista de administración -->
                </div>
            </main>
        </div>
    </div>

    <!-- Pie de página reutilizable -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS (Única carga limpia) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
