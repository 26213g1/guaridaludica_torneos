<div th:fragment="barra-filtros-productos">
    <form method="get" th:action="@{/admin/productos}" class="row g-3 mb-4 p-3 bg-white rounded shadow-sm align-items-center">
        
        <!-- 1. Búsqueda por Nombre (span 3) -->
        <div class="col-md-3">
            <input type="text" name="query" th:value="${query}" placeholder="Buscar por nombre..."
                class="form-control" />
        </div>

        <!-- 2. Selector de Categoría (span 2) -->
        <div class="col-md-2">
            <select name="categoriaId" class="form-select">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${todasCategorias}" th:value="${cat.id}" th:text="${cat.nombre}"
                    th:selected="${cat.id == categoriaId}">
                </option>
            </select>
        </div>

        <!-- 3. Rango de Precios (span 2) -->
        <div class="col-md-2">
            <div class="input-group">
                <input type="number" step="0.01" name="minPrecio" th:value="${minPrecio}" placeholder="Mín €"
                    class="form-control" />
                <input type="number" step="0.01" name="maxPrecio" th:value="${maxPrecio}" placeholder="Máx €"
                    class="form-control" />
            </div>
        </div>

        <!-- 4. Checkboxes (span 2) -->
        <div class="col-md-2 d-flex flex-column gap-1">
            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" name="sinCategoria" id="sinCategoria" value="true"
                    th:checked="${sinCategoria}" />
                <label class="form-check-label small" for="sinCategoria">
                    Sin categoría
                </label>
            </div>

            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="sinStock" name="sinStock" value="true"
                    th:checked="${sinStock}" />
                <label class="form-check-label small text-danger fw-semibold" for="sinStock">
                    🔴 Sin stock
                </label>
            </div>
        </div>

        <!-- 5. Botones de Acción (span 3) -> 3+2+2+2+3 = 12 exactos -->
        <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Filtrar
            </button>

            <a th:href="@{/admin/productos}" class="btn btn-outline-secondary" 
               th:if="${query != null and query != '' or categoriaId != null or minPrecio != null or maxPrecio != null or sinCategoria != null or sinStock != null}">
               Limpiar
            </a>
        </div>
    </form>
</div>
