<div th:fragment="barra-filtros-productos">
    <!-- Formulario de Filtros y Búsqueda -->
    <form th:action="@{/admin/productos}" method="get" class="mb-4 row g-2 align-items-center">

        <!-- 1. Búsqueda por Nombre -->
        <div class="col-auto">
            <input type="text" name="query" th:value="${query}" placeholder="Buscar por nombre..."
                class="form-control form-control-sm" />
        </div>

        <!-- 2. Selector de Categoría -->
        <div class="col-auto">
            <select name="categoriaId" class="form-select form-select-sm">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${todasCategorias}" th:value="${cat.id}" th:text="${cat.nombre}"
                    th:selected="${cat.id == categoriaId}">
                </option>
            </select>
        </div>

        <!-- 3. Rango de Precios -->
        <div class="col-auto">
            <input type="number" step="0.01" name="minPrecio" th:value="${minPrecio}" placeholder="Min €"
                class="form-control form-control-sm" style="width: 90px;" />
        </div>
        <div class="col-auto">
            <input type="number" step="0.01" name="maxPrecio" th:value="${maxPrecio}" placeholder="Max €"
                class="form-control form-control-sm" style="width: 90px;" />
        </div>

        <!-- 4. Checkbox Sin Categoría -->
        <div class="col-auto">
            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" name="sinCategoria" id="sinCategoria" value="true"
                    th:checked="${sinCategoria}" />
                <label class="form-check-label small" for="sinCategoria">
                    Sin categoría
                </label>
            </div>
        </div>

        <!-- 5. Checkbox Sin Stock (¡Ahora con su col-auto para que no rompa la línea!) -->
        <div class="col-auto">
            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="sinStock" name="sinStock" value="true"
                    th:checked="${sinStock}" />
                <label class="form-check-label small text-danger fw-semibold" for="sinStock">
                    🔴 Sin stock
                </label>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-sm px-3">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Filtrar
            </button>
        </div>

        <!-- Botón para limpiar filtros -->
        <div class="col-auto" th:if="${query != null or categoriaId != null or minPrecio != null or maxPrecio != null or sinCategoria != null or sinStock != null}">
            <a th:href="@{/admin/productos}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
        </div>
    </form>
</div>
