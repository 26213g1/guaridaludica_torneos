<div th:fragment="barra-filtros-productos">
    <!-- Formulario de Filtros y Búsqueda -->
    <form th:action="@{/admin/productos}" method="get" class="mb-4 row g-3 align-items-center">

        <!-- 1. Búsqueda por Nombre -->
        <div class="col-auto">
            <input type="text" name="query" th:value="${query}" placeholder="Buscar por nombre..."
                class="form-control" />
        </div>

        <!-- 2. Selector de Categoría -->
        <div class="col-auto">
            <select name="categoriaId" class="form-select">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${todasCategorias}" th:value="${cat.id}" th:text="${cat.nombre}"
                    th:selected="${cat.id == categoriaId}">
                </option>
            </select>
        </div>

        <!-- 3. Rango de Precios -->
        <div class="col-auto">
            <input type="number" step="0.01" name="minPrecio" th:value="${minPrecio}" placeholder="Min €"
                class="form-control" style="width: 100px;" />
        </div>
        <div class="col-auto">
            <input type="number" step="0.01" name="maxPrecio" th:value="${maxPrecio}" placeholder="Max €"
                class="form-control" style="width: 100px;" />
        </div>

        <!-- 4. Checkbox Sin Categoría -->
        <div class="col-auto">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sinCategoria" id="sinCategoria" value="true"
                    th:checked="${sinCategoria}" />
                <label class="form-check-label" for="sinCategoria">
                    Sin categoría
                </label>
            </div>
        </div>

        <!-- Botón de Filtrar -->
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">🔍 Filtrar</button>
        </div>

        <!-- Botón para limpiar filtros (opcional pero muy útil) -->
        <div class="col-auto" th:if="${query != null or sinCategoria != null}">
            <a th:href="@{/admin/productos}" class="btn btn-outline-secondary">Limpiar filtros</a>
        </div>
    </form>


</div>
