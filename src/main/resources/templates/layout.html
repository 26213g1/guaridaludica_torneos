<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Guarida Lúdica - Gestión de Torneos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (opcional para los menús) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        /* Barra superior oscura corporativa similar a la tienda */
        .navbar-custom {
            background-color: #1a1d20;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
    </style>
</head>
<body>

<!-- 1. Barra de Navegación Superior -->
<nav class="navbar navbar-expand-lg navbar-custom px-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <i class="bi bi-dice-5-fill text-warning"></i> LA GUARIDA LÚDICA <span class="badge bg-secondary fs-6">Torneos</span>
        </a>
        <!-- Espacio reservado para futuros botones de Login / Usuario -->
        <div class="d-flex align-items-center gap-3">
            <a href="#" class="btn btn-outline-light btn-sm px-3">
                <i class="bi bi-person-fill"></i> Login
            </a>
        </div>
    </div>
</nav>

<!-- 2. Contenedor Principal (Rejilla de 2 columnas: Sidebar + Contenido) -->
<div class="container-fluid my-4">
    <div class="row">

        <!-- Columna Izquierda: Índice / Barra Lateral (aprox. 33% o col-md-3) -->
        <div class="col-md-3 mb-4">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Columna Derecha: Contenido Dinámico (aprox. 66% o col-md-9) -->
        <div class="col-md-9">
            <!-- Mensajes Flash globales de éxito o error -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="server">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="server">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Contenido específico de cada vista -->
            <div class="card shadow-sm border-0 p-4">
                <div th:replace="${template}"></div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
