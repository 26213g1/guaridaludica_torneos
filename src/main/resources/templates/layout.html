<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Guarida Lúdica - Tu Tienda de Juegos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- Barra de navegación superior -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Contenedor principal -->
    <div class="container my-4">
        <div class="row">
            
            <!-- 1. Menú lateral para pantallas grandes (Desktop) -->
            <aside class="col-lg-3 mb-3 d-none d-lg-block">
                <div class="sidebar">
                    <h5 class="fw-bold mb-3">Categorías</h5>
                    <div id="categorias">
                        <a th:each="cat : ${categorias}" th:href="@{/categoria/{id}(id=${cat.id})}" class="nav-link-cat"
                            th:text="${cat.nombre}">Nombre Categoría</a>
                    </div>
                </div>
            </aside>

            <!-- 2. Contenido principal y menú desplegable para móviles -->
            <main class="col-12 col-lg-9">
                <h2 class="titulo-seccion-moderno-degradado" th:text="${appConfig.cabeceraInicio}">Cabecera Inicio</h2>

                <!-- Barra de búsqueda general que se ve en todas las vistas del layout -->
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body p-2">
                        <form th:action="@{/buscar}" method="get" class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" name="query" class="form-control border-start-0 ps-0" 
                                   placeholder="Buscar juegos de mesa..." th:value="${query}">
                            <button class="btn btn-dark" type="submit">Buscar</button>
                        </form>
                    </div>
                </div>

                <!-- Botón desplegable para móviles limpio -->
                <div class="d-lg-none mb-3">
                    <button class="btn btn-outline-dark w-100 d-flex justify-content-between align-items-center" 
                            type="button" 
                            onclick="let m = document.getElementById('cajaCategoriasMovil'); m.style.display = (m.style.display === 'block' ? 'none' : 'block');">
                        <span><i class="fa-solid fa-list"></i> Filtrar por Categorías</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    
                    <!-- Contenedor que usa los estilos definidos en main.css -->
                    <div id="cajaCategoriasMovil" class="mt-2" style="display: none;">
                        <div class="d-flex flex-column gap-2">
                            <a th:each="cat : ${categorias}" th:href="@{/categoria/{id}(id=${cat.id})}" class="nav-link-cat text-dark text-decoration-none py-1 border-bottom"
                                th:text="${cat.nombre}">Nombre Categoría</a>
                        </div>
                    </div>
                </div>

                <!-- Vista dinámica que se inyecta -->
                <div th:replace="${content}"></div>
            </main>

        </div>
    </div>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>&copy; 2026 La Guarida Lúdica.</small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
