<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarida Lúdica - Gestión de Torneos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (opcional para los menús) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        /* Barra superior oscura corporativa similar a la tienda */
        .navbar-custom {
            background-color: #1a1d20;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-dice-5-fill text-warning"></i> LA GUARIDA LÚDICA <span class="badge bg-secondary fs-6">Torneos</span>
            </a>

            <!-- Zona de Autenticación en el Navbar -->
            <div class="d-flex align-items-center gap-3">

                <!-- CASO A: Si el usuario NO ha iniciado sesión -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3 me-2">
                        <i class="bi bi-person-fill"></i> Login
                    </a>
                    <a th:href="@{/registro}" class="btn btn-warning btn-sm px-3 text-dark fw-bold">
                        Registro
                    </a>
                </div>

                <!-- CASO B: Si el usuario SÍ ha iniciado sesión -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <!-- Enlace exclusivo para Administradores -->
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/admin}"
                       class="btn btn-outline-warning btn-sm">
                        <i class="bi bi-speedometer2"></i> Panel Admin
                    </a>

                    <span class="text-light small">
                        <i class="bi bi-person-check-fill text-success"></i>
                        Hola, <strong sec:authentication="name">Usuario</strong>
                    </span>

                    <!-- Botón de Logout (requiere método POST por seguridad en Spring Security) -->
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </nav>
</nav>

<!-- 2. Contenedor Principal (Rejilla de 2 columnas: Sidebar + Contenido) -->
<div class="container-fluid my-4">
    <div class="row">

        <!-- Columna Izquierda: Índice / Barra Lateral (aprox. 33% o col-md-3) -->
        <div class="col-md-3 mb-4">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Columna Derecha: Contenido Dinámico (aprox. 66% o col-md-9) -->
        <div class="col-md-9">
            <!-- Mensajes Flash globales de éxito o error -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="server">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="server">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Contenido específico de cada vista -->
            <div class="card shadow-sm border-0 p-4">
                <div th:replace="~{${template}}"></div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
