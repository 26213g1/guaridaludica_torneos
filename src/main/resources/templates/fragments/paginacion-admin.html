<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="pagination-admin(urlBase)">
        <nav th:if="${elementos.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <!-- Botón Anterior -->
                <li class="page-item" th:classappend="${elementos.first} ? 'disabled'">
                    <a class="page-link" 
                       th:href="@{${urlBase}(page=${elementos.number - 1}, size=${elementos.size})}">
                        Anterior
                    </a>
                </li>

                <!-- Números de página -->
                <li class="page-item" 
                    th:each="i : ${#numbers.sequence(0, elementos.totalPages - 1)}" 
                    th:classappend="${i == elementos.number} ? 'active'">
                    <a class="page-link" 
                       th:href="@{${urlBase}(page=${i}, size=${elementos.size})}" 
                       th:text="${i + 1}">1</a>
                </li>

                <!-- Botón Siguiente -->
                <li class="page-item" th:classappend="${elementos.last} ? 'disabled'">
                    <a class="page-link" 
                       th:href="@{${urlBase}(page=${elementos.number + 1}, size=${elementos.size})}">
                        Siguiente
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
