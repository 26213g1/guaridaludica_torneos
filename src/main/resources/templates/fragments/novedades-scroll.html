<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Fragmento del scroll horizontal de novedades -->
    <div th:fragment="scroll-novedades" class="mb-4" th:if="${productosNuevos != null and !productosNuevos.isEmpty()}">
        <div class="d-flex align-items-center mb-3">
            <h5 class="fw-bold text-dark m-0">
                <i class="fa-solid fa-wand-magic-sparkles text-primary me-2"></i>Novedades Destacadas
            </h5>
        </div>
        
        <!-- Contenedor con desplazamiento horizontal fluido (ancho de tarjeta reducido a 220px) -->
        <div class="d-flex flex-row flex-nowrap overflow-auto gap-3 pb-2" style="scrollbar-width: thin;">
            <div th:each="producto : ${productosNuevos}" style="flex: 0 0 220px; min-width: 220px;">
                <div class="card h-100 shadow-sm card-producto p-2 position-relative">
                    <div class="ribbon-agotado" th:if="${producto.stock == 0}">AGOTADO</div>
                    <div class="ribbon-nuevo" th:if="${producto.esNuevo(diasNuevo)}">NUEVO</div>

                    <div class="card-img-wrapper p-2">
                        <a th:href="@{/producto/{id}(id=${producto.id})}">
                            <img th:src="@{${producto.imagenPrincipalUrl}}" class="card-img-top rounded" th:alt="${producto.nombre}">
                        </a>
                    </div>

                    <div class="card-body d-flex flex-column pt-2">
                        <h6 class="card-title mb-2 text-truncate">
                            <a th:href="@{/producto/{id}(id=${producto.id})}" class="producto-titulo text-dark text-decoration-none" th:text="${producto.nombre}">Nombre</a>
                        </h6>

                        <div class="mb-2 d-flex flex-column" style="min-height: 50px;">
                            <!-- Precio anterior (espacio reservado) -->
                            <div style="height: 18px;">
                                <span class="text-muted text-decoration-line-through small" 
                                    th:if="${producto.precioAnterior != null}" 
                                    th:text="${producto.precioAnterior} + ' ' + ${appConfig.simboloMoneda}">85.00 €</span>
                            </div>
                            
                            <!-- Precio actual + IVA compacto -->
                            <div class="d-flex align-items-baseline gap-2">
                                <span class="fs-5 fw-bold text-success lh-1" th:text="${producto.precio} + ' ' + ${appConfig.simboloMoneda}">Precio</span>
                                <span class="text-muted" style="font-size: 0.65rem;" th:text="${appConfig.textoImpuesto}">IVA incluido</span>
                            </div>
                        </div>

                        <!-- Bloque de duración y jugadores eliminado para ganar minimalismo -->

                        <div class="mt-auto pt-2">
                            <div class="d-flex gap-2 align-items-center">
                                <form th:action="@{/carrito/agregar}" method="post" class="m-0 flex-grow-1">
                                    <input type="hidden" name="id" th:value="${producto.id}" />
                                    <button type="submit" class="btn btn-outline-success w-100 py-1.5 btn-sm" th:disabled="${producto.stock == 0}">
                                        <i class="bi bi-cart-plus"></i> <span class="ms-1">Añadir</span>
                                    </button>
                                </form>

                                <div th:unless="${usuario != null}" class="d-inline-block" title="Inicia sesión para favoritos">
                                    <button type="button" class="btn btn-outline-secondary py-1.5 px-2 btn-sm" disabled><i class="fa-regular fa-heart"></i></button>
                                </div>

                                <form th:if="${usuario != null}" th:action="@{/favorito/toggle/{id}(id=${producto.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-outline-danger py-1.5 px-2 btn-sm" title="Favorito">
                                        <i th:if="${#sets.contains(usuario.favoritos, producto)}" class="fa-solid fa-heart"></i>
                                        <i th:unless="${#sets.contains(usuario.favoritos, producto)}" class="fa-regular fa-heart"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <hr class="my-4 text-muted">
    </div>
</body>
</html>
