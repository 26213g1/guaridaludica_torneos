<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" th:text="${appConfig.nombre}">Nombre tienda</a>
        <!-- Formulario de Búsqueda en la Navbar -->
        <form th:action="@{/buscar}" method="get" class="d-flex mx-auto" style="width: 40%;">
            <input class="form-control me-2" type="search" name="query" placeholder="Buscar juegos de mesa..."
                aria-label="Buscar" required>
            <button class="btn btn-outline-light" type="submit">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
        <div class="d-flex ms-auto align-items-center">
            <!-- Si NO está autenticado (Anónimo) -->
            <div sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-light btn-sm me-2">👤 Login</a>
                <a href="/registro" class="btn btn-outline-light btn-sm me-2">✨ Registro</a>
            </div>

            <!-- Si SÍ está autenticado (Logueado) -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center me-3">
                <span class="text-light me-3" th:if="${#authentication.principal != null}">
                👤 Hola, <strong th:text="${#authentication.principal.username}">Alias</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
                </form>
            </div>

            <!-- Carrito (siempre visible para todos) -->
            <a th:href="@{/carrito}" class="btn btn-outline-light btn-sm position-relative">
                🛒 
                <span class="badge rounded-pill bg-danger" th:text="${cantidadCarrito != null ? cantidadCarrito : 0}">
                    0
                </span>
            </a>

        </div>
    </div>
</nav>
