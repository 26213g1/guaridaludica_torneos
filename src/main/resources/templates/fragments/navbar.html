<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/images/logoGuarida02.svg}" alt="La Guarida Lúdica" style="height: 50px;" class="me-2">
        </a>

        <div class="d-flex ms-auto align-items-center">
            <!-- Si NO está autenticado (Anónimo) -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">👤 Login</a>
            </div>

            <!-- Si SÍ está autenticado (Logueado) -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center me-3">

                <!-- Enlace de Panel Admin (VISIBLE SOLO PARA ROLE_ADMIN) -->
                <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-warning btn-sm me-3">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Admin
                </a>
                
                <!-- Enlace a Mi Cuenta integrado como parte del saludo o enlace visible -->
                <a th:href="@{/perfil}" class="text-light text-decoration-none me-3">
                    👤 Hola, <strong th:text="${#authentication.principal.username}">Alias</strong>
                </a>
                
                <form th:action="@{/logout}" method="post" class="d-inline m-0 me-2">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
                </form>
            </div>

            <!-- Carrito (siempre visible para todos) -->
            <a th:href="@{/carrito}" class="btn btn-outline-light btn-sm position-relative">
                🛒 
                <span class="badge rounded-pill bg-danger" th:text="${cantidadCarrito != null ? cantidadCarrito : 0}">
                    0
                </span>
            </a>

        </div>
    </div>
</nav>
