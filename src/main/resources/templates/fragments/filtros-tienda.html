<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="filtros-publicos">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter me-2 text-primary"></i> Filtrar Juegos</h5>
                
                <form method="get" th:action="@{/}" class="d-flex flex-column gap-3">
                    
                    <!-- Mantener la categoría actual si se está filtrando por ella -->
                    <input type="hidden" name="categoriaId" th:if="${categoriaSeleccionada != null}" th:value="${categoriaSeleccionada}" />

                    <!-- Precio Máximo con visor en tiempo real -->
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-muted mb-0">Precio Máximo</label>
                            <span class="badge bg-dark text-white">
                                <span class="valorPrecio" th:text="${(maxPrecio != null ? maxPrecio : 100) + ' ' + appConfig.simboloMoneda}">100 €</span>
                            </span>
                        </div>
                        <!-- Añadimos una clase identificativa 'rango-precio-input' para controlarlo con JS -->
                        <input type="range" class="form-range rango-precio-input" min="0" max="400" step="5" name="maxPrecio" 
                               th:value="${maxPrecio != null ? maxPrecio : 100}"
                               th:data-simbolo="${appConfig.simboloMoneda}">
                    </div>

                    <!-- Jugadores -->
                    <div>
                        <label class="form-label small fw-semibold text-muted">Jugadores</label>
                        <select name="jugadores" class="form-select form-select-sm">
                            <option value="">Cualquier número</option>
                            <option value="1" th:selected="${jugadores == 1}">1 jugador (Solo)</option>
                            <option value="2" th:selected="${jugadores == 2}">2 jugadores</option>
                            <option value="3" th:selected="${jugadores == 3}">3 - 4 jugadores</option>
                            <option value="5" th:selected="${jugadores == 5}">5+ jugadores (Grupos)</option>
                        </select>
                    </div>

                    <!-- Duración de la partida -->
                    <div>
                        <label class="form-label small fw-semibold text-muted">Duración de la partida</label>
                        <select name="rangoDuracion" class="form-select form-select-sm">
                            <option value="">Cualquier duración</option>
                            <option value="30" th:selected="${rangoDuracion == '30'}">Partidas rápidas (&le; 30 min)</option>
                            <option value="60" th:selected="${rangoDuracion == '60'}">Duración media (~ 60 min)</option>
                            <option value="90" th:selected="${rangoDuracion == '90'}">Partidas largas (&gt; 90 min)</option>
                        </select>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex flex-column gap-2 mt-2">
                        <!-- <button type="submit" class="btn btn-dark btn-sm w-100">
                            Aplicar filtros
                        </button> -->
                        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm w-100">
                            Limpiar filtros
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Enlazamos nuestro archivo JavaScript externo -->
        <script th:src="@{/js/filtros.js}"></script>
    </div>
</body>
</html>
