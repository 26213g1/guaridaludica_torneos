<!-- Fragmento de paginación reutilizable -->
<nav th:fragment="pagination(pageUrl)" th:if="${totalPages > 1}" aria-label="Navegación de páginas" class="my-5">
    <ul class="pagination justify-content-center">
        
        <!-- Botón Anterior -->
        <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
            <a class="page-link" th:href="@{__${pageUrl}__(page=${currentPage - 1})}" tabindex="-1">Anterior</a>
        </li>

        <!-- Números de página -->
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{__${pageUrl}__(page=${i})}" th:text="${i + 1}">1</a>
        </li>

        <!-- Botón Siguiente -->
        <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
            <a class="page-link" th:href="@{__${pageUrl}__(page=${currentPage + 1})}">Siguiente</a>
        </li>
        
    </ul>
</nav>
