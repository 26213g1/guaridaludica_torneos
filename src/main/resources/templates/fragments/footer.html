<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <footer th:fragment="footer" class="bg-dark text-white pt-4 pb-3 mt-auto border-top border-secondary">
        <div class="container">
            <div class="row">
                
                <!-- Columna 1: Información / Nombre de la tienda -->
                <div class="col-md-6 mb-3">                    
                    <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                        <img th:src="@{/images/logoGuarida02.svg}" alt="La Guarida Lúdica" style="height: 60px;" class="me-2">
                    </a>
                    
                    <!-- Redes sociales -->
                    <div class="mt-3" th:if="${contactoConfiguracion != null and contactoConfiguracion.redes != null}">
                        <a th:if="${contactoConfiguracion.redes.instagram}" 
                           th:href="${contactoConfiguracion.redes.instagram}" 
                           target="_blank" class="me-3 fs-5 text-decoration-none">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a th:if="${contactoConfiguracion.redes.twitter}" 
                           th:href="${contactoConfiguracion.redes.twitter}" 
                           target="_blank" class="fs-5 text-decoration-none">
                            <i class="bi bi-twitter-x"></i>
                        </a>
                    </div>
                </div>

                <!-- Columna 2: Contacto -->
                <div class="col-md-6 mb-3 text-md-end" th:if="${contactoConfiguracion != null}">
                    <h6 class="text-uppercase fw-bold text-light">Contacto</h6>
                    <ul class="list-unstyled small">
                        <li th:if="${contactoConfiguracion.direccion}" class="mb-1">
                            <i class="bi bi-geo-alt-fill me-1"></i> 
                            <span th:text="${contactoConfiguracion.direccion}">Dirección</span>
                        </li>
                        <li th:if="${contactoConfiguracion.email}" class="mb-1">
                            <i class="bi bi-envelope-fill me-1"></i> 
                            <a th:href="'mailto:' + ${contactoConfiguracion.email}" class="text-decoration-none" th:text="${contactoConfiguracion.email}">email</a>
                        </li>
                        <li th:if="${contactoConfiguracion.telefono}">
                            <i class="bi bi-telephone-fill me-1"></i> 
                            <span th:text="${contactoConfiguracion.telefono}">Teléfono</span>
                        </li>
                    </ul>
                </div>
            </div>

            <hr class="border-secondary my-2">

            <!-- Copyright inferior -->
            <div class="text-center small">
                &copy; <span th:text="${anioActual}">2026</span> La Guarida Lúdica. Todos los derechos reservados.
            </div>
        </div>
    </footer>
</body>
</html>
