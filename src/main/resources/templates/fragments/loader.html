<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="globalLoader" id="global-loader">
        <div class="card loader-card p-4 text-center shadow-lg border-0">
            <div class="spinner-border text-primary mx-auto mb-3" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h5 class="text-secondary mb-1">Barajando cartas...</h5>
            <p class="text-muted small mb-0">Preparando la siguiente jugada</p>
        </div>
    </div>
</body>
</html>
