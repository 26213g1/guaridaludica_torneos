<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Gestión de Torneos</h3>
                <p class="text-muted mb-0">Listado de torneos programados en La Guarida Lúdica.</p>
            </div>
            <a th:href="@{/torneos/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Torneo
            </a>
        </div>

        <!-- Tabla limpia sin duplicar contenedores card -->
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th style="width: 80px;" class="text-center">Imagen</th>
                        <th>Nombre del Torneo</th>
                        <th>Juego Asociado</th>
                        <th>Fecha</th>
                        <th class="text-center">Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${not #lists.isEmpty(torneos)}" th:each="torneo : ${torneos}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${torneo.id}">1</td>
                        
                        <td class="text-center">
                            <img th:if="${torneo.imagenUrl != null and !torneo.imagenUrl.isEmpty()}" 
                                 th:src="${torneo.imagenUrl}" 
                                 alt="Cartel" 
                                 class="rounded shadow-sm" 
                                 style="width: 45px; height: 45px; object-fit: cover;">
                            <div th:unless="${torneo.imagenUrl != null and !torneo.imagenUrl.isEmpty()}" 
                                 class="bg-light rounded d-flex align-items-center justify-content-center text-muted mx-auto border" 
                                 style="width: 45px; height: 45px;">
                                <i class="bi bi-trophy"></i>
                            </div>
                        </td>

                        <td class="fw-semibold text-dark" th:text="${torneo.nombre}">Torneo</td>
                        <td th:text="${torneo.juego != null ? torneo.juego.nombre : 'Sin juego'}">Catan</td>
                        <td th:text="${torneo.fecha}">2026-10-20</td>
                        <td class="text-center">
                            <span class="badge bg-success" th:text="${torneo.estado}">ABIERTO</span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Botones de acción si procede -->
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(torneos)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-trophy fs-2 d-block mb-2"></i>
                            No hay torneos registrados todavía.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
