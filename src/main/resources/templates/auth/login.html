<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - La Guarida Lúdica</title>
</head>
<body>
<div th:fragment="content" class="container mt-5">
    <div class="row justify-content-center">
        <!-- Usamos la misma anchura mínima para evitar que se comprima -->
        <div class="col-md-6 col-lg-4" style="min-width: 320px;">
            <div class="card shadow-sm p-4">
                <h3 class="card-title text-center mb-4 text-primary">Iniciar Sesión</h3>

                <!-- Mensaje de error si el login falla -->
                <div th:if="${param.error}" class="alert alert-danger text-center">
                    Email o contraseña incorrectos.
                </div>

                <!-- Mensaje de éxito (por ejemplo, al registrarse) -->
                <div th:if="${param.logout}" class="alert alert-success text-center">
                    Has cerrado sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <!-- Token de seguridad CSRF obligatorio -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="username" class="form-control" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <!-- Enlace para ir al registro -->
                <div class="text-center mt-3">
                    <p class="text-muted mb-0">¿No tienes cuenta? <a th:href="@{/registro}" class="text-decoration-none">Regístrate aquí</a></p>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
