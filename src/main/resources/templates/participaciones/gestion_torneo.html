<div xmlns:th="http://www.thymeleaf.org">
    <div class="container mt-4">
        <h2>🏆 Gestión de Resultados del Torneo</h2>
        <p class="text-muted">Introduce la puntuación obtenida por cada participante. Al guardar, el sistema ordenará la clasificación, asignará el ganador y actualizará el ELO automáticamente.</p>

        <form th:action="@{/participaciones/torneo/{id}/finalizar(id=${torneoId})}" th:object="${wrapper}" method="post">
            
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Jugador</th>
                        <th style="width: 200px;">Puntuación</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, stat : *{participaciones}">
                        <!-- Input oculto para conservar el ID de la participación en el envío -->
                        <input type="hidden" th:field="*{participaciones[__${stat.index}__].id}" />
                        
                        <td th:text="${p.jugador.apodo}">Apodo del Jugador</td>
                        <td>
                            <input type="number" class="form-control" th:field="*{participaciones[__${stat.index}__].puntuacion}" required min="0" />
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="mt-3">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-trophy"></i> Finalizar Torneo y Calcular ELO
                </button>
                <a th:href="@{/torneos}" class="btn btn-secondary">Volver a Torneos</a>
            </div>
        </form>
    </div>
</div>
