<div xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-0">Gestión Global de Participaciones</h3>
            <p class="text-muted small mb-0">Vista de Administrador: Control general de inscripciones y puntuaciones.</p>
        </div>
        <a th:href="@{/torneos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver a Torneos
        </a>
    </div>

    <!-- Tabla global de participaciones -->
    <div class="table-responsive" th:if="${not #lists.isEmpty(participaciones)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Torneo</th>
                <th>Jugador (Email / Usuario)</th>
                <th class="text-center">Puntuación</th>
                <th class="text-center">Posición</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${participaciones}">
                <td class="fw-bold" th:text="${p.torneo != null ? p.torneo.nombre : 'Torneo eliminado'}">Torneo</td>
                <td th:text="${p.jugador != null ? p.jugador.email : 'Jugador desconocido'}">Jugador</td>
                <td class="text-center" th:text="${p.puntuacion}">0</td>
                <td class="text-center" th:text="${p.posicion != null ? p.posicion : '-'}">-</td>
                <td class="text-end">
                    <a th:href="@{/torneos/{id}(id=${p.torneo.id})}" class="btn btn-sm btn-outline-primary" title="Ver Torneo">
                        <i class="bi bi-eye"></i> Ver
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Estado vacío -->
    <div class="text-center py-4" th:if="${#lists.isEmpty(participaciones)}">
        <p class="text-muted mb-0">No hay participaciones registradas en el sistema actualmente.</p>
    </div>
</div>
