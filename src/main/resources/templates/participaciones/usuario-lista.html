<div xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Mis Participaciones</h3>
        <a th:href="@{/torneos}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-trophy"></i> Ver Torneos Disponibles
        </a>
    </div>

    <!-- Tabla de participaciones del usuario -->
    <div class="table-responsive" th:if="${not #lists.isEmpty(participaciones)}">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Torneo</th>
                <th>Estado</th>
                <th class="text-center">Puntuación</th>
                <th class="text-center">Posición</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${participaciones}">
                <td class="fw-bold" th:text="${p.torneo != null ? p.torneo.nombre : 'Torneo no disponible'}">Nombre Torneo</td>
                <td>
                        <span class="badge"
                              th:classappend="${p.torneo != null and p.torneo.estado == 'ABIERTO'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${p.torneo != null ? p.torneo.estado : 'N/D'}">Estado</span>
                </td>
                <td class="text-center" th:text="${p.puntuacion}">0</td>
                <td class="text-center" th:text="${p.posicion != null ? p.posicion : '-'}">-</td>
                <td class="text-end">
                    <!-- Botón de desinscripción: Solo aparece si el torneo está ABIERTO -->
                    <form th:if="${p.torneo != null and p.torneo.estado == 'ABIERTO'}"
                          th:action="@{/participaciones/torneo/{id}/desinscribir(id=${p.torneo.id})}"
                          method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                title="Desinscribirme"
                                onclick="return confirm('¿Estás seguro de que deseas desinscribirte de este torneo?');">
                            <i class="bi bi-x-circle"></i> Salir
                        </button>
                    </form>
                    <span th:unless="${p.torneo != null and p.torneo.estado == 'ABIERTO'}" class="text-muted small">Cerrado</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Estado vacío -->
    <div class="text-center py-4" th:if="${#lists.isEmpty(participaciones)}">
        <p class="text-muted mb-3">Aún no estás inscrito en ningún torneo.</p>
        <a th:href="@{/torneos}" class="btn btn-primary btn-sm">Explorar torneos</a>
    </div>
</div>
