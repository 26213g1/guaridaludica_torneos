<div xmlns:th="http://www.thymeleaf.org">
    <div class="text-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-award text-warning"></i> Comunidad La Guarida Lúdica</h2>
        <p class="text-muted">Conoce a los miembros de nuestra comunidad de juegos de mesa y compite en nuestros torneos.</p>
        <div class="mt-3" th:if="${#authorization.expression('isAuthenticated()')} == false">
            <a th:href="@{/login}" class="btn btn-primary me-2"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</a>
            <a th:href="@{/registro}" class="btn btn-outline-success"><i class="bi bi-person-plus"></i> Registrarse</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Jugador</th>
                    <th class="text-end">Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="j, iterStat : ${ranking}">
                    <td class="fw-bold" th:text="${iterStat.count}">1</td>
                    <td>
                        <i class="bi bi-person-fill text-secondary me-2"></i>
                        <span th:text="${j.nombre}">Nombre</span>
                    </td>
                    <td class="text-end">
                        <span class="badge bg-success">Miembro Activo</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ranking)}">
                    <td colspan="3" class="text-center text-muted py-4">Aún no hay jugadores públicos registrados. ¡Sé el primero!</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
