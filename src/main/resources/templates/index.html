<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">

<body>
    <main>
        <h2 class="mb-4">Catálogo de Juegos Modernos</h2>

        <!-- Grid de productos (quitamos table-responsive de aquí) -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Aquí usamos th:each para iterar tus productos -->
            <div class="col" th:each="producto : ${productos}">
                <div class="card h-100 shadow-sm">


                    <div class="card-img-wrapper">
                        <a th:href="@{/producto/{id}(id=${producto.id})}">
                            <img th:src="${producto.imagenPrincipalUrl}" class="card-img-top"
                                th:alt="${producto.nombre}">
                        </a>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title" th:text="${producto.nombre}">Nombre</h5>
                        <p class="card-text text-muted" th:text="${producto.precio} + ' ' + ${appConfig.simboloMoneda}">Precio</p>
                        <p class="card-text small" th:text="${#strings.abbreviate(producto.descripcion, 80)}">Desc...</p>
                        <a th:href="@{/producto/{id}(id=${producto.id})}" class="btn btn-primary btn-sm">Ver Detalles</a>
                        
                        <div class="mt-2">
                            <span th:if="${producto.stock > 0}" class="badge bg-success">En Stock</span>
                            <span th:if="${producto.stock == 0}" class="badge bg-danger">Agotado</span>
                            
                            <!-- Formulario para añadir al carrito -->
                            <form th:action="@{/carrito/agregar}" method="post" class="mt-2">
                                <input type="hidden" name="id" th:value="${producto.id}" />
                                <button type="submit" class="btn btn-outline-success btn-sm w-100" th:disabled="${producto.stock == 0}">
                                    <i class="bi bi-cart-plus"></i> Añadir al carrito
                                </button>
                            </form>
                        </div>
                    </div>
                </div>                
            </div>
        </div> <!-- Fin del row de productos -->

        <!-- Reemplaza todo el bloque <nav> anterior por esta única línea -->
        <div th:replace="~{fragments/paginacion :: pagination('/')}"></div>

    </main>
</body>

</html>
