<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">

<body>
    <main>
        <!-- Grid de productos (máximo 2 productos por fila en móvil, 3 en PC) -->
        <div class="row row-cols-2 row-cols-md-3 g-4">
            <!-- Aquí usamos th:each para iterar tus productos -->
            <div class="col" th:each="producto : ${productos}">
                <!-- Añadimos un padding un poco mayor (p-3) para ampliar visualmente la tarjeta -->
                <div class="card h-100 shadow-sm card-producto p-2 position-relative">

                    <!-- Cinta AGOTADO (Esquina superior izquierda) -->
                    <div class="ribbon-agotado" th:if="${producto.stock == 0}">
                        AGOTADO
                    </div>

                    <!-- Cinta NUEVO (Esquina superior derecha) -->
                    <div class="ribbon-nuevo" th:if="${producto.esNuevo(diasNuevo)}">
                        NUEVO
                    </div>

                    <!-- Imagen enlazada al detalle -->
                    <div class="card-img-wrapper p-2">
                        <a th:href="@{/producto/{id}(id=${producto.id})}">
                            <img th:src="@{${producto.imagenPrincipalUrl}}" class="card-img-top rounded"
                                th:alt="${producto.nombre}">
                        </a>
                    </div>

                    <div class="card-body d-flex flex-column pt-3">
                        <!-- Título con más énfasis (fw-bold y un tamaño equilibrado) -->
                        <h5 class="card-title mb-2">
                            <a th:href="@{/producto/{id}(id=${producto.id})}" class="producto-titulo" th:text="${producto.nombre}">Nombre</a>
                        </h5>

                        <!-- Zona de Precios: Precio actual + Precio anterior tachado (si existe) -->
                        <div class="mb-3 d-flex align-items-center gap-2">
                            <span class="fs-4 fw-bold text-success"
                                th:text="${producto.precio} + ' ' + ${appConfig.simboloMoneda}">Precio</span>

                            <!-- Precio anterior tachado dinámico -->
                            <span class="text-muted text-decoration-line-through small"
                                th:if="${producto.precioAnterior != null}"
                                th:text="${producto.precioAnterior} + ' ' + ${appConfig.simboloMoneda}">85.00 €</span>
                        </div>

                        <!-- Información extra del juego en negrita con iconos -->
                        <div class="mb-3 text-muted small d-flex gap-3">
                            <!-- Duración dinámica (solo se muestra si tiene valor) -->
                            <span title="Duración de la partida" th:if="${producto.duracionPartida != null}">
                                <i class="bi bi-clock me-1"></i> <strong class="text-dark"
                                    th:text="${producto.duracionPartida}">60-90 min</strong>
                            </span>

                            <span title="Número de jugadores">
                                <i class="bi bi-person me-1"></i>
                                <strong class="text-dark">
                                    <span th:text="${producto.minJugadores}">1</span>-<span
                                        th:text="${producto.maxJugadores}">4</span> jug.
                                </strong>
                            </span>
                        </div>

                        <!-- ZONA INFERIOR UNIFICADA: Añadir al carrito + Botón de Favoritos al lado -->
                        <div class="mt-auto pt-2">
                            <div class="d-flex gap-2 align-items-center">
                                
                                <!-- Formulario para añadir al carrito (ocupa el espacio principal) -->
                                <form th:action="@{/carrito/agregar}" method="post" class="m-0 flex-grow-1">
                                    <input type="hidden" name="id" th:value="${producto.id}" />
                                    <button type="submit" class="btn btn-outline-success w-100 py-2"
                                        th:disabled="${producto.stock == 0}">
                                        <i class="bi bi-cart-plus fa-lg"></i> <span class="ms-1 fw-semibold">Añadir</span>
                                    </button>
                                </form>

                                <!-- Formulario de Favoritos al lado -->
                                <!-- SI EL USUARIO NO ESTÁ LOGUEADO: Botón desactivado con aviso -->
                                <div th:unless="${usuario != null}" class="d-inline-block" title="Inicia sesión para añadir a favoritos y guardar tus juegos">
                                    <button type="button" class="btn btn-outline-secondary py-2 px-3" disabled>
                                        <i class="fa-regular fa-heart"></i>
                                    </button>
                                </div>

                                <!-- SI EL USUARIO SÍ ESTÁ LOGUEADO: Botón funcional de favoritos -->
                                <form th:if="${usuario != null}" th:action="@{/favorito/toggle/{id}(id=${producto.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-outline-danger py-2 px-3" title="Gestionar favoritos">
                                        <!-- Corazón relleno si ya es favorito -->
                                        <i th:if="${#sets.contains(usuario.favoritos, producto)}" class="fa-solid fa-heart"></i>
                                        <!-- Corazón vacío si no lo es -->
                                        <i th:unless="${#sets.contains(usuario.favoritos, producto)}" class="fa-regular fa-heart"></i>
                                    </button>
                                </form>

                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div> <!-- Fin del row de productos -->

        <!-- Paginación -->
        <div class="mt-4" th:replace="~{fragments/paginacion :: pagination('/')}"></div>

    </main>
</body>

</html>
