<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">

<body>
    <main>
        <h2 class="mb-4">Catálogo de Juegos Modernos</h2>

        <!-- Grid de productos (máximo 2 productos por fila en móvil, 3 en PC) -->
        <div class="row row-cols-2 row-cols-md-3 g-4">
            <!-- Aquí usamos th:each para iterar tus productos -->
            <div class="col" th:each="producto : ${productos}">
                <div class="card h-100 shadow-sm card-producto">

                    <!-- Cinta AGOTADO (Esquina superior izquierda) -->
                    <div class="ribbon-agotado" th:if="${producto.stock == 0}">
                        AGOTADO
                    </div>

                    <!-- Cinta NUEVO (Esquina superior derecha) -->
                    <div class="ribbon-nuevo" th:if="${producto.esNuevo(diasNuevo)}">
                        NUEVO
                    </div>

                    <!-- Imagen enlazada al detalle -->
                    <div class="card-img-wrapper">
                        <a th:href="@{/producto/{id}(id=${producto.id})}">
                            <img th:src="@{${producto.imagenPrincipalUrl}}" class="card-img-top"
                                th:alt="${producto.nombre}">
                        </a>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <!-- Título con más énfasis (fw-bold y un tamaño equilibrado) -->
                        <h5 class="card-title fw-bold text-dark mb-2" th:text="${producto.nombre}">Nombre</h5>

                        <!-- Zona de Precios: Precio actual + Precio anterior tachado -->
                        <div class="mb-2 d-flex align-items-center gap-2">
                            <span class="fs-5 fw-bold text-success"
                                th:text="${producto.precio} + ' ' + ${appConfig.simboloMoneda}">Precio</span>
                            <span class="text-muted text-decoration-line-through small">85.00 €</span>
                        </div>

                        <!-- Información extra del juego en negrita con iconos -->
                        <div class="mb-3 text-muted small d-flex gap-3">
                            <span title="Duración de la partida">
                                <i class="bi bi-clock me-1"></i> <strong class="text-dark">60-90 min</strong>
                            </span>
                            <span title="Número de jugadores">
                                <i class="bi bi-person me-1"></i> 
                                <strong class="text-dark">
                                    <span th:text="${producto.minJugadores}">1</span>-<span th:text="${producto.maxJugadores}">4</span> jug.
                                </strong>
                            </span>
                        </div>

                        <!-- Formulario compacto para añadir al carrito -->
                        <div class="mt-auto pt-2">
                            <form th:action="@{/carrito/agregar}" method="post" class="m-0">
                                <input type="hidden" name="id" th:value="${producto.id}" />
                                <button type="submit" class="btn btn-outline-success btn-sm w-100 py-1"
                                    th:disabled="${producto.stock == 0}">
                                    <i class="bi bi-cart-plus fa-lg"></i> <span class="ms-1">Añadir</span>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div> <!-- Fin del row de productos -->

        <!-- Reemplaza todo el bloque <nav> anterior por esta única línea -->
        <div th:replace="~{fragments/paginacion :: pagination('/')}"></div>

    </main>
</body>

</html>
