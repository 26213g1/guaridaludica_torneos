<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-simple :: layout(~{::main})}">
<body>
    <main>
        <div class="container my-4">
            <h2 class="mb-4">Tu Carrito de Compras</h2>
            
            <!-- Si hay items -->
            <div th:if="${not #lists.isEmpty(items)}" class="row">
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table align-middle bg-white shadow-sm rounded">
                            <thead class="table-light">
                                <tr>
                                    <th>Juego</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td th:text="${item.nombre}">Juego</td>
                                    <td th:text="${#numbers.formatDecimal(item.precio, 1, 2)} + ' ' + ${appConfig.simboloMoneda}">0 €</td>
                                    <td th:text="${item.cantidad}">1</td>
                                    <td th:text="${#numbers.formatDecimal(item.precio * item.cantidad, 1, 2)} + ' ' + ${appConfig.simboloMoneda}">0 €</td>
                                    <td>
                                        <!-- Botón para eliminar el item del carrito -->
                                        <form th:action="@{/carrito/eliminar}" method="post" style="display:inline;">
                                            <input type="hidden" name="id" th:value="${item.productoId}">
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Botones de navegación inferiores (Seguir comprando) -->
                    <div class="d-flex justify-content-between my-3">
                        <a th:href="@{/}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Seguir comprando
                        </a>
                    </div>
                </div>

                <!-- Columna de Resumen -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h4 class="card-title mb-3">Resumen</h4>
                            <p class="fs-5">Total: 
                                <strong class="text-success" th:text="${#numbers.formatDecimal(total, 1, 2)} + ' ' + ${appConfig.simboloMoneda}">0 €</strong>
                            </p>
                            <!-- Botón de acción principal (Verde) -->
                            <a th:href="@{/pedido/checkout}" class="btn btn-success w-100 py-2">
                                Tramitar Pedido <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Si está vacío -->
            <div th:if="${#lists.isEmpty(items)}" class="text-center py-5 border rounded bg-white">
                <i class="bi bi-cart-x fs-1 text-muted"></i>
                <p class="fs-4 text-muted mt-3">Tu carrito está vacío.</p>
                <a th:href="@{/}" class="btn btn-primary mt-2">Volver al Catálogo</a>
            </div>
        </div>
    </main>
</body>
</html>
