<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-simple :: layout(~{::main})}">
<body>
    <main>
        <div class="container py-5">
            <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 600px;">
                <div class="text-center mb-4">
                    <i class="bi bi-credit-card-2-front text-primary" style="font-size: 3.5rem;"></i>
                    <h2 class="fw-bold mt-2">Pasarela de Pago Simulada</h2>
                    <p class="text-muted">Simula una pasarela bancaria segura (TPV / PayPal)</p>
                </div>

                <div class="bg-light p-3 rounded mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Pedido ID:</span>
                        <strong th:text="'#' + ${pedido.id}">#1</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Destino:</span>
                        <span th:text="${pedido.direccionCalle} + ', ' + ${pedido.direccionNumero}">Calle, 12</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5">
                        <span class="fw-bold">Total a Pagar:</span>
                        <strong class="text-success" th:text="${#numbers.formatDecimal(pedido.total, 1, 2)} + ' €'">0.00 €</strong>
                    </div>
                </div>

                <!-- Opciones de acción -->
                <div class="d-grid gap-2">
                    <form th:action="@{/pedido/confirmar-pago/{id}(id=${pedido.id})}" method="post">
                        <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold">
                            <i class="bi bi-check-circle"></i> Simular Pago Exitoso
                        </button>
                    </form>

                    <form th:action="@{/pedido/cancelar/{id}(id=${pedido.id})}" method="post">
                        <button type="submit" class="btn btn-outline-danger w-100 py-2">
                            <i class="bi bi-x-circle"></i> Cancelar y Volver al Carrito
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
