<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-simple :: layout(~{::main})}">
<body>
    <main>
        <div class="container text-center py-5">
            <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 600px;">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold mb-3">¡Pedido Realizado con Éxito!</h2>
                <p class="text-muted fs-5 mb-4">Gracias por confiar en <strong>La Guarida Lúdica</strong>. Tu pedido ha sido registrado correctamente.</p>
                <p class="mb-4">Identificador de tu pedido: <span class="badge bg-secondary fs-6" th:text="${idPedido}">#123</span></p>
                <a th:href="@{/}" class="btn btn-primary btn-lg w-100">Volver al Catálogo de Juegos</a>
            </div>
        </div>
    </main>
</body>
</html>
