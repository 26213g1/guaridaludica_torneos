<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.nombre}">Detalle del Juego</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- FontAwesome para los iconos (¡Importante para la lupa!) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- Barra superior (Navbar) -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <a th:href="@{/}" class="btn btn-secondary mb-4">← Volver al catálogo</a>
        
        <div class="bg-white p-4 rounded shadow-sm">
            
            <!-- FILA SUPERIOR: Carrusel y Datos principales -->
            <div class="row align-items-start">
                
                <div class="col-md-5">
                    <div th:replace="~{fragments/carrusel :: carrusel}"></div>
                </div>
                
                <div class="col-md-7">
                    <h2 class="fw-bold" th:text="${producto.nombre}">Nombre del Juego</h2>
                    <h3 class="text-primary fw-bold my-3" th:text="${producto.precio} + ' ' + ${appConfig.simboloMoneda}">0.00 €</h3>
                    
                    <hr>
                    
                    <p class="mb-2"><strong>👥 Jugadores:</strong> <span th:text="${producto.minJugadores}"></span> a <span th:text="${producto.maxJugadores}"></span></p>
                    
                    <div class="mb-3">
                        <span class="text-muted"><strong>Categorías: </strong></span>
                        <span th:each="cat : ${producto.categorias}" 
                            class="badge bg-secondary me-1" 
                            th:text="${cat.nombre}">
                        </span>
                    </div>
                    <p class="mb-4"><strong>📦 Stock disponible:</strong> <span th:text="${producto.stock}"></span> unidades</p>
                    
                    <form th:action="@{/carrito/agregar}" method="post">
                        <input type="hidden" name="id" th:value="${producto.id}">
                        <div class="input-group mb-3">
                            <!-- Opcional: Selector de cantidad si quieres permitir elegir cuántos añadir -->
                            <!--<input type="number" name="cantidad" value="1" min="1" max="${producto.stock}" class="form-control" style="max-width: 90px;" /> -->
                            <button type="submit" class="btn btn-success btn-lg flex-grow-1">
                                <i class="fas fa-cart-plus me-2"></i> Añadir al Carrito
                            </button>
                        </div>
                    </form>
                    
                </div>
                
            </div>

            <div class="row mt-5">
                <div class="col-12 border-top pt-4">
                    <h4 class="fw-bold mb-3">Descripción del juego</h4>
                    
                    <!-- Contenedor del texto (si es muy largo, aplicamos una clase para limitar o estructurar) -->
                    <div class="text-muted" style="line-height: 1.7;">
                        
                        <!-- Si la descripción es corta se muestra entera, si es larga podemos usar el collapse -->
                        <div id="descripcionCorta" th:text="${#strings.length(producto.descripcion) > 300 ? #strings.substring(producto.descripcion, 0, 300) + '...' : producto.descripcion}">
                            Descripción resumida...
                        </div>

                        <!-- El bloque completo oculto por defecto que se despliega -->
                        <div class="collapse mt-2" id="descripcionCompleta">
                            <p class="mb-0 text-muted" th:text="${producto.descripcion}" style="line-height: 1.7;"></p>
                        </div>

                        <!-- Botón desplegable (Solo aparece si el texto es lo suficientemente largo, o puedes dejarlo fijo) -->
                        <button class="btn btn-link text-decoration-none p-0 mt-2 fw-bold" 
                                type="button" 
                                data-bs-toggle="collapse" 
                                data-bs-target="#descripcionCompleta" 
                                aria-expanded="false" 
                                aria-controls="descripcionCompleta" 
                                id="btnLeerMas"
                                th:if="${#strings.length(producto.descripcion) > 300}">
                            Leer más...
                        </button>
                    </div>

                </div>
            </div>
            
        </div>
    </div>
    <!-- ENLAZAMOS EL FICHERO JS EXTERNO AQUÍ -->
    <script th:src="@{/js/leerDescripcion.js}"></script>
</body>
</html>
