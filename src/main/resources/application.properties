# Configuración del pool de conexiones Hikari para Supabase
spring.datasource.hikari.max-lifetime=287000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Deshabilitar prepared statements en caché para el Transaction Pooler de Supabase
spring.datasource.hikari.dataSource.prepareThreshold=0
spring.datasource.hikari.dataSource.preparedStatementCacheQueries=0

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

